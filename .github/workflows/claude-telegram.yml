# Managed by claude-telegram-bot (v2). Manual edits will be overwritten.
name: Claude Telegram

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task id
        required: true
      kind:
        description: task, probe, apk, screens or revert
        required: false
        default: task

permissions:
  contents: write
  id-token: write

concurrency:
  group: claude-telegram-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  claude:
    if: github.actor == 'burakkolik'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOT_URL: https://claude-telegram-bot.burakc3tin.workers.dev
      TASK_ID: ${{ inputs.task }}
      JOB_KIND: ${{ inputs.kind }}
    steps:
      - name: Download runner
        run: curl -fsSL --retry 3 "$BOT_URL/runner/runner.mjs" -o "$RUNNER_TEMP/runner.mjs"

      - uses: actions/checkout@v4
        if: inputs.kind != 'probe'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: (inputs.kind == 'apk' || inputs.kind == 'screens') && hashFiles('pubspec.yaml') != ''
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        if: inputs.kind != 'probe' && inputs.kind != 'revert' && hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Claude session
        if: inputs.kind == 'task'
        uses: actions/cache/restore@v4
        with:
          path: ~/.claude/projects
          key: claude-session-${{ inputs.task }}-${{ github.run_id }}
          restore-keys: claude-session-${{ inputs.task }}-

      - name: Install Claude Code
        if: inputs.kind == 'task' || inputs.kind == 'probe'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run
        if: inputs.kind != 'screens'
        run: node "$RUNNER_TEMP/runner.mjs"

      - name: Enable KVM
        if: inputs.kind == 'screens'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on Android emulator
        if: inputs.kind == 'screens'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node "$RUNNER_TEMP/runner.mjs"

      - name: Save Claude session
        if: always() && inputs.kind == 'task'
        uses: actions/cache/save@v4
        with:
          path: ~/.claude/projects
          key: claude-session-${{ inputs.task }}-${{ github.run_id }}

      - name: Report failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/runner.mjs" ]; then node "$RUNNER_TEMP/runner.mjs" --failed; fi
